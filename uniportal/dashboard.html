<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tableau de bord - UniPortal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<!-- is-loading masque le contenu tant que requireAuth() n'a pas confirmé la session -->
<body data-page="dashboard" class="is-loading">

  <div class="bubbles" aria-hidden="true">
    <div class="bubble bubble--1"></div>
    <div class="bubble bubble--2"></div>
    <div class="bubble bubble--3"></div>
    <div class="bubble bubble--4"></div>
    <div class="bubble bubble--6"></div>
  </div>

  <header class="navbar">
    <div class="container navbar__inner">
      <a href="index.html" class="logo" aria-label="UniPortal, accueil">
        <span class="logo__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10 12 5 2 10l10 5 10-5Z"/><path d="M6 12v5c3 2 9 2 12 0v-5"/><path d="M22 10v6"/></svg></span>
        <span>Uni<em>Portal</em></span>
      </a>
      <div class="navbar__actions">
        <div class="nav-links">
          <a href="#espace">Mon espace</a>
          <a href="#inspecteur">Inspecteur JWT</a>
        </div>
      </div>
    </div>
  </header>

  <main class="dashboard">
    <div class="container">

      <!-- En-tête utilisateur -->
      <section class="card user-bar" aria-label="Utilisateur connecté">
        <div class="user-bar__identity">
          <div class="avatar" id="user-avatar"></div>
          <div style="min-width:0">
            <div class="user-bar__name" id="user-name"></div>
            <div class="user-bar__email" id="user-email"></div>
            <span class="role-pill" id="user-role"></span>
          </div>
        </div>
        <button class="btn btn--ghost btn--sm" data-action="logout">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
          Se déconnecter
        </button>
      </section>

      <!-- Vue conditionnelle selon le rôle (§3.5.3), remplie par app.js -->
      <section class="card panel" id="espace" style="margin-top:24px"></section>

      <!-- Inspecteur JWT (§3.2.5, §3.6.1, §3.6.2) -->
      <section class="card panel" id="inspecteur">
        <div class="panel__head">
          <div>
            <span class="eyebrow">Panneau pédagogique</span>
            <h2>Inspecteur JWT</h2>
            <p>Décodage local, sans vérification de signature : lisible ne veut pas dire fiable (§3.6.2).</p>
          </div>
          <div class="tabs" role="tablist" aria-label="Jeton à inspecter">
            <button class="tab is-active" role="tab" aria-selected="true" data-token="id">ID token</button>
            <button class="tab" role="tab" aria-selected="false" data-token="access">Access token</button>
          </div>
        </div>

        <p class="muted-note" id="jwt-purpose" style="margin:-6px 0 16px"></p>
        <div id="jwt-content"></div>
      </section>

    </div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.auth0.com/js/auth0-spa-js/2.1.3/auth0-spa-js.production.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
