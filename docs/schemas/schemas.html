<!DOCTYPE html>

<!--
  Source des figures 4.1 à 4.3 de la documentation.

<style>
  body { margin: 0; padding: 24px; background: #fff; font-family: "Inter", system-ui, sans-serif; }
  svg { display: block; margin-bottom: 40px; }
  .t   { font: 600 15px Inter, system-ui, sans-serif; fill: #1e1b4b; }
  .tb  { font: 800 17px Inter, system-ui, sans-serif; fill: #1e1b4b; }
  .tw  { font: 800 16px Inter, system-ui, sans-serif; fill: #ffffff; }
  .s   { font: 500 13px Inter, system-ui, sans-serif; fill: #6b6a85; }
  .m   { font: 500 12.5px "JetBrains Mono", ui-monospace, monospace; fill: #312e81; }

  .ko  { font: 700 13px "JetBrains Mono", monospace; fill: #dc2626; }

</style>
</head>
<body>

<!-- ================= Figure 4.1 : architecture ================= -->
<svg id="architecture" width="1400" height="640" viewBox="0 0 1400 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e1b4b"/>
    </marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
  </defs>
  <rect width="1400" height="640" rx="20" fill="#f3f2f9"/>

  <!-- Navigateur -->
  <rect x="40" y="70" width="400" height="330" rx="16" fill="#fff" stroke="#d5d3e8" stroke-width="1.5"/>
  <rect x="40" y="70" width="400" height="50" rx="16" fill="#1e1b4b"/>
  <rect x="40" y="100" width="400" height="20" fill="#1e1b4b"/>
  <text x="64" y="102" class="tw">Navigateur de l'utilisateur</text>
  <text x="64" y="152" class="t">SPA UniPortal (HTML, CSS, JS vanilla)</text>
  <text x="64" y="178" class="m">index.html  callback.html  dashboard.html</text>
  <rect x="64" y="198" width="352" height="82" rx="10" fill="#eef0ff"/>
  <text x="80" y="222" class="t">js/auth.js</text>
  <text x="80" y="244" class="s">Encapsule le SDK auth0-spa-js 2.1.3 :</text>
  <text x="80" y="264" class="s">PKCE, state, nonce, cache des jetons</text>
  <rect x="64" y="292" width="352" height="82" rx="10" fill="#eef0ff"/>
  <text x="80" y="316" class="t">js/app.js</text>
  <text x="80" y="338" class="s">Vues par rôle, console API,</text>
  <text x="80" y="358" class="s">inspecteur JWT</text>

  <!-- Auth0 -->
  <rect x="960" y="70" width="400" height="330" rx="16" fill="#fff" stroke="#d5d3e8" stroke-width="1.5"/>
  <rect x="960" y="70" width="400" height="50" rx="16" fill="#f59e0b"/>
  <rect x="960" y="100" width="400" height="20" fill="#f59e0b"/>
  <text x="984" y="102" class="tw">Tenant Auth0 (IDaaS)</text>
  <text x="984" y="152" class="t">Universal Login, connexions, MFA</text>
  <text x="984" y="182" class="m">/authorize</text>
  <text x="984" y="204" class="m">/oauth/token</text>
  <text x="984" y="226" class="m">/v2/logout</text>
  <text x="984" y="248" class="m">/.well-known/jwks.json</text>
  <rect x="984" y="270" width="352" height="104" rx="10" fill="#fef3c7"/>
  <text x="1000" y="294" class="t">Rôles et Action post-login</text>
  <text x="1000" y="316" class="s">etudiant, enseignant</text>
  <text x="1000" y="338" class="s">Injecte la claim des rôles dans</text>
  <text x="1000" y="358" class="s">l'ID token et l'access token</text>

  <!-- Google -->
  <rect x="1060" y="490" width="300" height="100" rx="16" fill="#fff" stroke="#d5d3e8" stroke-width="1.5"/>
  <text x="1084" y="530" class="t">Fournisseur social (Google)</text>
  <text x="1084" y="556" class="s">Fédération d'identité</text>

  <!-- Serveur -->
  <rect x="40" y="470" width="660" height="140" rx="16" fill="#fff" stroke="#d5d3e8" stroke-width="1.5"/>
  <rect x="40" y="470" width="660" height="50" rx="16" fill="#312e81"/>
  <rect x="40" y="500" width="660" height="20" fill="#312e81"/>
  <text x="64" y="502" class="tw">Serveur UniPortal (Node.js, sans dépendance)</text>
  <text x="64" y="552" class="t">server.js</text>
  <text x="64" y="574" class="s">Fichiers du frontend et routes /api</text>
  <text x="290" y="552" class="t">jwt.js</text>
  <text x="290" y="574" class="s">Validation RS256, iss, aud, exp</text>
  <text x="520" y="552" class="t">data.js</text>
  <text x="520" y="574" class="s">Notes en mémoire</text>

  <!-- Fleches -->
  <line x1="446" y1="180" x2="954" y2="180" stroke="#1e1b4b" stroke-width="2" marker-end="url(#a1)" marker-start="url(#a1)"/>
  <text x="700" y="160" text-anchor="middle" class="t">Authorization Code + PKCE</text>
  <text x="700" y="206" text-anchor="middle" class="m">HTTPS, TCP/443 - étapes 2 à 5</text>

  <line x1="1210" y1="406" x2="1210" y2="484" stroke="#1e1b4b" stroke-width="2" marker-end="url(#a1)" marker-start="url(#a1)"/>
  <text x="1226" y="450" class="s">OIDC fédéré</text>

  <line x1="240" y1="406" x2="240" y2="464" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#a2)"/>
  <text x="256" y="430" class="ma">GET /api/... </text>
  <text x="256" y="450" class="ma">Authorization: Bearer access_token</text>

  <path d="M706 540 C 860 540, 900 470, 980 406" fill="none" stroke="#1e1b4b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a1)"/>
  <text x="760" y="600" class="m">GET /.well-known/jwks.json</text>
  <text x="760" y="620" class="s">clés publiques, HTTPS sortant (cache 10 min)</text>

</svg>

<!-- ================= Figure 4.2 : sequence ================= -->
<svg id="sequence" width="1400" height="900" viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="b1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e1b4b"/>
    </marker>
    <marker id="b2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
  </defs>
  <rect width="1400" height="900" rx="20" fill="#f3f2f9"/>

  <!-- Acteurs -->
  <g>
    <rect x="70" y="70" width="200" height="54" rx="12" fill="#1e1b4b"/><text x="170" y="103" text-anchor="middle" class="tw">Utilisateur</text>
    <rect x="390" y="70" width="240" height="54" rx="12" fill="#1e1b4b"/><text x="510" y="103" text-anchor="middle" class="tw">Navigateur / SPA</text>
    <rect x="760" y="70" width="240" height="54" rx="12" fill="#f59e0b"/><text x="880" y="103" text-anchor="middle" class="tw">Tenant Auth0</text>
    <rect x="1110" y="70" width="240" height="54" rx="12" fill="#312e81"/><text x="1230" y="103" text-anchor="middle" class="tw">API UniPortal</text>
  </g>
  <g stroke="#b9b6d6" stroke-width="2" stroke-dasharray="5 6">
    <line x1="170" y1="124" x2="170" y2="870"/>
    <line x1="510" y1="124" x2="510" y2="870"/>
    <line x1="880" y1="124" x2="880" y2="870"/>
    <line x1="1230" y1="124" x2="1230" y2="870"/>
  </g>

  <!-- 1 -->
  <text x="40" y="170" class="num">1</text>
  <line x1="170" y1="170" x2="504" y2="170" stroke="#1e1b4b" stroke-width="2" marker-end="url(#b1)"/>
  <text x="186" y="160" class="t">Clic sur « Se connecter »</text>
  <rect x="520" y="186" width="330" height="58" rx="8" fill="#fff" stroke="#d5d3e8"/>
  <text x="532" y="208" class="m">code_verifier, state, nonce</text>
  <text x="532" y="230" class="m">code_challenge = S256(verifier)</text>

  <!-- 2 -->
  <text x="40" y="282" class="num">2</text>
  <line x1="510" y1="282" x2="874" y2="282" stroke="#1e1b4b" stroke-width="2" marker-end="url(#b1)"/>
  <text x="526" y="272" class="m">GET /authorize?code_challenge&amp;state&amp;nonce</text>

  <!-- 3 -->
  <text x="40" y="340" class="num">3</text>
  <line x1="170" y1="340" x2="874" y2="340" stroke="#1e1b4b" stroke-width="2" marker-end="url(#b1)" marker-start="url(#b1)"/>
  <text x="186" y="330" class="t">Universal Login : identifiants, Google ou MFA (le mot de passe reste chez Auth0)</text>

  <!-- 4 -->
  <text x="40" y="400" class="num">4</text>
  <line x1="880" y1="400" x2="516" y2="400" stroke="#1e1b4b" stroke-width="2" marker-end="url(#b1)"/>
  <text x="526" y="390" class="m">302 callback.html?code&amp;state</text>
  <rect x="520" y="414" width="250" height="34" rx="8" fill="#fff" stroke="#d5d3e8"/>
  <text x="532" y="436" class="m">vérifie state (anti-CSRF)</text>
  <line x1="510" y1="478" x2="874" y2="478" stroke="#1e1b4b" stroke-width="2" marker-end="url(#b1)"/>
  <text x="526" y="468" class="m">POST /oauth/token code + code_verifier</text>

  <!-- 5 -->
  <text x="40" y="536" class="num">5</text>
  <line x1="880" y1="536" x2="516" y2="536" stroke="#1e1b4b" stroke-width="2" marker-end="url(#b1)"/>
  <text x="526" y="526" class="m">200 id_token, access_token, refresh_token</text>
  <rect x="520" y="550" width="330" height="34" rx="8" fill="#fff" stroke="#d5d3e8"/>
  <text x="532" y="572" class="m">valide l'ID token (iss, aud, nonce)</text>

  <!-- 6 -->
  <text x="40" y="630" class="num">6</text>
  <line x1="510" y1="630" x2="1224" y2="630" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#b2)"/>
  <text x="526" y="620" class="ma">GET /api/notes/me   Authorization: Bearer access_token</text>
  <line x1="1230" y1="684" x2="886" y2="684" stroke="#1e1b4b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#b1)"/>
  <text x="900" y="674" class="m">GET /.well-known/jwks.json</text>
  <text x="900" y="704" class="s">si la clé n'est pas en cache</text>
  <rect x="1000" y="722" width="380" height="58" rx="8" fill="#fff" stroke="#d5d3e8"/>
  <text x="1012" y="745" class="m">signature, alg, iss, aud, exp</text>
  <text x="1012" y="767" class="m">puis rôle, propriété, affectation</text>
  <line x1="1230" y1="820" x2="516" y2="820" stroke="#1e1b4b" stroke-width="2" marker-end="url(#b1)"/>
  <text x="560" y="810" class="ok">200 données</text>
  <text x="680" y="810" class="ko">401 jeton invalide</text>
  <text x="860" y="810" class="ko">403 action interdite</text>
</svg>

<!-- ================= Figure 4.3 : chaine de validation ================= -->
<svg id="validation" width="1400" height="420" viewBox="0 0 1400 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="c1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e1b4b"/>
    </marker>
    <marker id="c2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="1400" height="420" rx="20" fill="#f3f2f9"/>
  <text x="40" y="72" class="s">Le premier contrôle qui échoue interrompt la chaîne. Les contrôles 1 à 7 portent sur le jeton (401), les suivants sur les droits (403).</text>

  <g id="steps">
    <!-- box helper: x, title, subtitle -->
    <rect x="40"   y="110" width="140" height="96" rx="12" fill="#fff" stroke="#1e1b4b" stroke-width="1.5"/>
    <text x="110" y="146" text-anchor="middle" class="t">1. En-tête</text><text x="110" y="168" text-anchor="middle" class="s">Bearer présent</text>

    <rect x="200"  y="110" width="140" height="96" rx="12" fill="#fff" stroke="#1e1b4b" stroke-width="1.5"/>
    <text x="270" y="146" text-anchor="middle" class="t">2. Format</text><text x="270" y="168" text-anchor="middle" class="s">3 segments</text>

    <rect x="360"  y="110" width="140" height="96" rx="12" fill="#fff" stroke="#1e1b4b" stroke-width="1.5"/>
    <text x="430" y="146" text-anchor="middle" class="t">3. Algorithme</text><text x="430" y="168" text-anchor="middle" class="s">RS256 seul</text>

    <rect x="520"  y="110" width="140" height="96" rx="12" fill="#fff" stroke="#1e1b4b" stroke-width="1.5"/>
    <text x="590" y="146" text-anchor="middle" class="t">4. Signature</text><text x="590" y="168" text-anchor="middle" class="s">clé du JWKS</text>

    <rect x="680"  y="110" width="140" height="96" rx="12" fill="#fff" stroke="#1e1b4b" stroke-width="1.5"/>
    <text x="750" y="146" text-anchor="middle" class="t">5. Émetteur</text><text x="750" y="168" text-anchor="middle" class="s">iss = tenant</text>

    <rect x="840"  y="110" width="140" height="96" rx="12" fill="#fff" stroke="#1e1b4b" stroke-width="1.5"/>
    <text x="910" y="146" text-anchor="middle" class="t">6. Audience</text><text x="910" y="168" text-anchor="middle" class="s">aud = API</text>

    <rect x="1000" y="110" width="140" height="96" rx="12" fill="#fff" stroke="#1e1b4b" stroke-width="1.5"/>
    <text x="1070" y="146" text-anchor="middle" class="t">7. Expiration</text><text x="1070" y="168" text-anchor="middle" class="s">exp, nbf (±60 s)</text>

    <rect x="1160" y="110" width="200" height="96" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="1260" y="140" text-anchor="middle" class="t">8. Droits</text>
    <text x="1260" y="162" text-anchor="middle" class="s">rôle, propriété,</text>
    <text x="1260" y="182" text-anchor="middle" class="s">affectation au cours</text>
  </g>

  <g stroke="#1e1b4b" stroke-width="2" marker-end="url(#c1)">
    <line x1="180" y1="158" x2="198" y2="158"/><line x1="340" y1="158" x2="358" y2="158"/>
    <line x1="500" y1="158" x2="518" y2="158"/><line x1="660" y1="158" x2="678" y2="158"/>
    <line x1="820" y1="158" x2="838" y2="158"/><line x1="980" y1="158" x2="998" y2="158"/>
    <line x1="1140" y1="158" x2="1158" y2="158"/>
  </g>

  <!-- Echecs 401 -->
  <g stroke="#dc2626" stroke-width="1.8" marker-end="url(#c2)">
    <line x1="110" y1="206" x2="110" y2="262"/><line x1="270" y1="206" x2="270" y2="262"/>
    <line x1="430" y1="206" x2="430" y2="262"/><line x1="590" y1="206" x2="590" y2="262"/>
    <line x1="750" y1="206" x2="750" y2="262"/><line x1="910" y1="206" x2="910" y2="262"/>
    <line x1="1070" y1="206" x2="1070" y2="262"/><line x1="1260" y1="206" x2="1260" y2="262"/>
  </g>
  <rect x="40" y="266" width="1100" height="54" rx="12" fill="#fee2e2"/>
  <text x="590" y="290" text-anchor="middle" class="ko">401 Unauthorized + WWW-Authenticate: Bearer error="invalid_token"</text>
  <text x="590" y="310" text-anchor="middle" class="s">jeton absent, falsifié, émis par un autre serveur, destiné à une autre API ou expiré</text>
  <rect x="1160" y="266" width="200" height="54" rx="12" fill="#fee2e2"/>
  <text x="1260" y="290" text-anchor="middle" class="ko">403 Forbidden</text>
  <text x="1260" y="310" text-anchor="middle" class="s">identité valide, action interdite</text>

  <rect x="1160" y="344" width="200" height="50" rx="12" fill="#d1fae5"/>
  <text x="1260" y="374" text-anchor="middle" class="ok">200 OK + liste checks</text>
  <path d="M1360 158 C 1390 158, 1390 369, 1362 369" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#c1)"/>
</svg>

</body>
